[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # style-src needs 'unsafe-inline' because the app sets inline styles from JS
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://nbswxmsopowarotqswnd.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# /sandbox opens the sandbox page, like sandbox.html
[[redirects]]
  from = "/sandbox"
  to = "/sandbox.html"
  status = 200

# /switching and /linux open the track pages
[[redirects]]
  from = "/switching"
  to = "/switching.html"
  status = 200

[[redirects]]
  from = "/linux"
  to = "/linux.html"
  status = 200

# Profile is now a view of the landing page
[[redirects]]
  from = "/profile.html"
  to = "/"
  status = 301
